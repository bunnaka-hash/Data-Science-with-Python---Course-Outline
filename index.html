<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STJ - Python for Data Science</title>
    <link rel="icon" type="image/png" href="./public/image/schoollogo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script
      src="https://kit.fontawesome.com/409239094a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <div class="brand">
        <span class="prompt">&gt;&gt;&gt;</span>
        <h1>STJ Program</h1>
      </div>

      <input
        class="search"
        id="navSearch"
        type="text"
        placeholder="Search modules…"
      />

      <nav id="navList">
        <div class="nav-group" id="navGroup"></div>
      </nav>
    </aside>

    <main>
      <section class="hero">
        <span class="eyebrow">course outline</span>
        <div class="hero-meta">
          <h2>STJ - Python for Data Science</h2>
          <button
            type="button"
            onclick="window.open('https://chatgpt.com/', '_blank')"
          >
            Any Questions?
          </button>
        </div>
      </section>

      <div class="content">
        <section id="modules"></section>
      </div>
    </main>

    <script src="./js/app.js" type="module"></script>
  </body>
</html>
