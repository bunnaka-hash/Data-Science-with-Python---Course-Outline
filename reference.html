<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STJ - References</title>
    <link rel="icon" type="image/png" href="./public/image/schoollogo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/slide.css" />
    <link rel="stylesheet" href="./css/reference.css" />
    <script
      src="https://kit.fontawesome.com/409239094a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="slide-page reference-page">
    <!-- ===== Sidebar: every resource in this module ===== -->
    <aside class="sidebar">
      <a class="back-link" href="./index.html">
        <i class="fa-solid fa-arrow-left"></i>
        Course outline
      </a>

      <div class="brand">
        <span class="prompt">&gt;&gt;&gt;</span>
        <h1 id="moduleTitle">Loading…</h1>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-label" id="progressLabel"></div>

      <nav id="referenceNav"></nav>

      <div class="sidebar-footer" id="moduleSwitch"></div>
    </aside>

    <!-- ===== Main: the library, or one resource playing in its place =====
         Both views live here. ?v= in the url decides which one is drawn;
         switching between them is a re-render, never a page load. -->
    <main class="deck">
      <header class="deck-top">
        <span class="eyebrow" id="referenceKicker">loading…</span>

        <!-- Rebuilt per view: filters in the library, transport in the player -->
        <div class="deck-controls" id="deckControls"></div>
      </header>

      <section class="stage" id="stage"></section>

      <footer class="deck-bottom" id="deckBottom"></footer>
    </main>

    <script src="./js/reference.js" type="module"></script>
  </body>
</html>
