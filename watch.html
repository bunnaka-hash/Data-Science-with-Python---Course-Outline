<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STJ - Watch</title>
    <link rel="icon" type="image/png" href="./public/image/schoollogo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/slide.css" />
    <link rel="stylesheet" href="./css/reference.css" />
    <script
      src="https://kit.fontawesome.com/409239094a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="slide-page reference-page watch-page">
    <!-- ===== Sidebar: the same resource list, as a playlist ===== -->
    <aside class="sidebar">
      <a class="back-link" id="backToRefs" href="./reference">
        <i class="fa-solid fa-arrow-left"></i>
        All references
      </a>

      <div class="brand">
        <span class="prompt">&gt;&gt;&gt;</span>
        <h1 id="moduleTitle">Loading…</h1>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-label" id="progressLabel"></div>

      <nav id="watchNav"></nav>
    </aside>

    <!-- ===== Main: the player ===== -->
    <main class="deck">
      <header class="deck-top">
        <span class="eyebrow" id="watchKicker">loading…</span>

        <div class="deck-controls">
          <button
            class="deck-btn"
            id="prevBtn"
            type="button"
            title="Previous resource (←)"
          >
            <i class="fa-solid fa-angle-left"></i>
          </button>
          <span class="deck-counter" id="watchCounter">– / –</span>
          <button
            class="deck-btn"
            id="nextBtn"
            type="button"
            title="Next resource (→)"
          >
            <i class="fa-solid fa-angle-right"></i>
          </button>
        </div>
      </header>

      <section class="stage" id="stage"></section>

      <footer class="deck-bottom" id="deckBottom"></footer>
    </main>

    <script src="./js/watch.js" type="module"></script>
  </body>
</html>
